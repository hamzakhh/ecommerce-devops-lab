name: Full DevOps Pipeline

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:

  # ─────────────────────────────────────────
  # JOB 1 — Terraform (Infrastructure)
  # ─────────────────────────────────────────
  terraform:
    name: Provision Infrastructure
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: terraform
    outputs:
      instance_ips: ${{ steps.export.outputs.instance_ips }}
      alb_dns: ${{ steps.export.outputs.alb_dns }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id:     ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region:            ${{ secrets.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false   # ← important pour que output soit parseable

      - name: Terraform Init
        run: terraform init

      - name: Terraform Validate
        run: terraform validate

      - name: Terraform Plan
        run: terraform plan -out=tfplan

      - name: Terraform Apply
        run: terraform apply -auto-approve tfplan

      - name: Export Outputs
        id: export
        run: |
          IPS=$(terraform output -json instance_public_ips \
                | jq -r '.[]' | tr '\n' ',' | sed 's/,$//')
          ALB=$(terraform output -raw alb_dns_name)
          echo "instance_ips=$IPS" >> $GITHUB_OUTPUT
          echo "alb_dns=$ALB"      >> $GITHUB_OUTPUT

      - name: Show ALB URL
        run: echo "🌐 App URL → http://${{ steps.export.outputs.alb_dns }}"

  # ─────────────────────────────────────────
  # JOB 2 — Ansible (Configuration & Deploy)
  # ─────────────────────────────────────────
  ansible:
    name: Configure & Deploy
    runs-on: ubuntu-latest
    needs: terraform

    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Install Ansible + deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ansible jq python3-pip
          ansible-galaxy collection install community.docker
          pip install boto3 --quiet

      - name: Setup SSH Key
        run: |
          echo "${{ secrets.EC2_KEY }}" > key.pem
          chmod 600 key.pem

      - name: Generate Inventory dynamically
        run: |
          echo "[web]" > inventory.ini
          for ip in $(echo "${{ needs.terraform.outputs.instance_ips }}" | tr ',' ' '); do
            echo "$ip ansible_user=ec2-user ansible_ssh_private_key_file=key.pem" >> inventory.ini
          done
          echo "" >> inventory.ini
          echo "[web:vars]" >> inventory.ini
          echo "ansible_ssh_common_args='-o StrictHostKeyChecking=no'" >> inventory.ini
          cat inventory.ini   # Debug — visible dans les logs GitHub Actions

      - name: Wait for EC2 to be ready (SSH)
        run: |
          for ip in $(echo "${{ needs.terraform.outputs.instance_ips }}" | tr ',' ' '); do
            echo "⏳ Waiting for $ip..."
            timeout 120 bash -c "until nc -zv $ip 22 2>/dev/null; do sleep 5; done"
            echo "✅ $ip is reachable"
          done

      - name: Run Ansible Playbook
        run: |
          ansible-playbook -i inventory.ini ansible/deploy.yml -v
        env:
          ANSIBLE_HOST_KEY_CHECKING: "False"
          ANSIBLE_TIMEOUT: "60"

      - name: Print App URL
        run: |
          echo "🚀 Deployment complete!"
          echo "🌐 Open → http://${{ needs.terraform.outputs.alb_dns }}"

  # ─────────────────────────────────────────
  # JOB 3 — Destroy (Manuel uniquement)
  # ─────────────────────────────────────────
  destroy:
    name: Destroy Infrastructure
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch'
    needs: []
    defaults:
      run:
        working-directory: terraform
    environment:
      name: production    # ← exige une validation manuelle dans GitHub

    steps:
      - uses: actions/checkout@v3

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id:     ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region:            ${{ secrets.AWS_REGION }}

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false

      - name: Terraform Init
        run: terraform init

      - name: Terraform Destroy
        run: terraform destroy -auto-approve