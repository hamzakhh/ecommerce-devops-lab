name: Full DevOps Pipeline

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:

  # ─────────────────────────────────────────
  # JOB 1 — Terraform
  # ─────────────────────────────────────────
  terraform:
    name: Provision Infrastructure
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: terraform
    outputs:
      instance_ips: ${{ steps.export.outputs.instance_ips }}
      alb_dns:      ${{ steps.export.outputs.alb_dns }}

    steps:
      - uses: actions/checkout@v3

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id:     ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token:     ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region:            us-east-1
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false

      - run: terraform init
      - run: terraform validate
      - run: terraform plan -out=tfplan
      - run: terraform apply -auto-approve tfplan

      - name: Export Outputs
        id: export
        run: |
          IPS=$(terraform output -json instance_public_ips \
                | jq -r '.[]' | tr '\n' ',' | sed 's/,$//')
          ALB=$(terraform output -raw alb_dns_name)
          echo "instance_ips=$IPS" >> $GITHUB_OUTPUT
          echo "alb_dns=$ALB"      >> $GITHUB_OUTPUT
      - name: Terraform Init
        run: |
         terraform init \
         -backend-config="bucket=ecommerce-tfstate-hamzakhh" \
         -backend-config="key=prod/terraform.tfstate" \
         -backend-config="region=us-east-1"

  # ─────────────────────────────────────────
  # JOB 2 — Ansible
  # ─────────────────────────────────────────
  ansible:
    name: Configure & Deploy
    runs-on: ubuntu-latest
    needs: terraform

    steps:
      - uses: actions/checkout@v3

      - name: Install Ansible + deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ansible jq python3-pip
          ansible-galaxy collection install community.docker
          pip install boto3 --quiet

      - name: Setup SSH Key
        run: |
          echo "${{ secrets.EC2_KEY }}" > key.pem
          chmod 600 key.pem

      - name: Generate Inventory
        run: |
          echo "[web]" > inventory.ini
          for ip in $(echo "${{ needs.terraform.outputs.instance_ips }}" | tr ',' ' '); do
            echo "$ip ansible_user=ec2-user ansible_ssh_private_key_file=key.pem" >> inventory.ini
          done
          echo -e "\n[web:vars]" >> inventory.ini
          echo "ansible_ssh_common_args='-o StrictHostKeyChecking=no'" >> inventory.ini
          cat inventory.ini

      - name: Wait for SSH
        run: |
          for ip in $(echo "${{ needs.terraform.outputs.instance_ips }}" | tr ',' ' '); do
            echo "⏳ Waiting for $ip..."
            timeout 120 bash -c "until nc -zv $ip 22 2>/dev/null; do sleep 5; done"
            echo "✅ $ip ready"
          done

      - name: Run Ansible Playbook
        run: ansible-playbook -i inventory.ini ansible/deploy.yml -v
        env:
          ANSIBLE_HOST_KEY_CHECKING: "False"
          ANSIBLE_TIMEOUT: "60"

      - name: Cleanup SSH Key        # ← sécurité
        if: always()
        run: rm -f key.pem

      - run: echo "🚀 http://${{ needs.terraform.outputs.alb_dns }}"
    # Dans pipeline.yml → job "ansible" → step "Setup SSH Key"

      - name: Setup SSH Key
        run: |
         echo "${{ secrets.EC2_KEY }}" | tr -d '\r' > key.pem
         chmod 600 key.pem
         ssh-keygen -y -f key.pem > /dev/null || (echo "❌ Invalid key format" && exit 1)

  # ─────────────────────────────────────────
  # JOB 3 — Destroy (manuel)
  # ─────────────────────────────────────────
  destroy:
    name: Destroy Infrastructure
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch'
    needs: [terraform]   # ← corrigé
    defaults:
      run:
        working-directory: terraform
    environment:
      name: production

    steps:
      - uses: actions/checkout@v3

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id:     ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token:     ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region:            ${{ secrets.AWS_REGION }}

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false

      - run: terraform init
      - run: terraform destroy -auto-approve
      - name: Terraform Init
        run: |
         terraform init \
         -backend-config="bucket=ecommerce-tfstate-hamzakhh" \
         -backend-config="key=prod/terraform.tfstate" \
         -backend-config="region=us-east-1"