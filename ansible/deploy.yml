---
- name: Deploy E-Commerce Application
  hosts: web
  become: yes
  gather_facts: no
  vars:
    ansible_python_interpreter: /usr/bin/python3
    app_dir: /opt/ecommerce
    compose_file: "{{ app_dir }}/docker-compose.yml"

  tasks:

    # ─────────────────────────────────────────
    # 0. Swap (fix mémoire insuffisante)
    # ─────────────────────────────────────────
    - name: Check if swap already exists
      command: swapon --show
      register: swap_check
      changed_when: false

    - name: Create swap file (1GB)
      command: dd if=/dev/zero of=/swapfile bs=128M count=8
      when: swap_check.stdout == ""

    - name: Set swap permissions
      file:
        path: /swapfile
        mode: '0600'
      when: swap_check.stdout == ""

    - name: Format swap
      command: mkswap /swapfile
      when: swap_check.stdout == ""

    - name: Enable swap
      command: swapon /swapfile
      when: swap_check.stdout == ""

    - name: Persist swap in fstab
      lineinfile:
        path: /etc/fstab
        line: '/swapfile swap swap defaults 0 0'
        state: present

    # ─────────────────────────────────────────
    # 0b. Gather facts APRÈS création du swap
    # ─────────────────────────────────────────
    - name: Gather facts
      setup:

    # ─────────────────────────────────────────
    # 1. Prérequis système
    # ─────────────────────────────────────────
    - name: Install required system packages
      yum:
        name:
          - curl
          - gnupg2
          - python3-pip
        state: present

    # ─────────────────────────────────────────
    # 2. Installation Docker
    # ─────────────────────────────────────────
    - name: Install Docker via amazon-linux-extras or yum
      shell: |
        amazon-linux-extras install docker -y || yum install docker -y
      args:
        creates: /usr/bin/docker

    - name: Install Docker Compose (standalone)
      shell: |
        curl -SL "https://github.com/docker/compose/releases/latest/download/docker-compose-linux-x86_64" \
          -o /usr/local/bin/docker-compose
        chmod +x /usr/local/bin/docker-compose
      args:
        creates: /usr/local/bin/docker-compose

    - name: Install docker Python SDK
      pip:
        name: docker
        state: present

    - name: Start and enable Docker service
      systemd:
        name: docker
        state: started
        enabled: yes

    - name: Add ec2-user to docker group
      user:
        name: ec2-user
        groups: docker
        append: yes

    # ─────────────────────────────────────────
    # 3. Préparer le répertoire de l'application
    # ─────────────────────────────────────────
    - name: Create application directory
      file:
        path: "{{ app_dir }}"
        state: directory
        owner: ec2-user
        group: ec2-user
        mode: '0755'

    - name: Copy docker-compose.yml to server
      copy:
        src: docker-compose.yml
        dest: "{{ compose_file }}"
        owner: ec2-user
        group: ec2-user
        mode: '0644'

    - name: Copy nginx.conf to server
      copy:
        src: nginx.conf
        dest: "{{ app_dir }}/nginx.conf"
        owner: ec2-user
        group: ec2-user
        mode: '0644'

    # ─────────────────────────────────────────
    # 4. Démarrer les conteneurs
    # ─────────────────────────────────────────
    - name: Pull and start containers via Docker Compose
      shell: |
        docker-compose -f {{ compose_file }} pull
        docker-compose -f {{ compose_file }} up -d
      become_user: ec2-user

    # ─────────────────────────────────────────
    # 5. Vérifications (HealthChecks)
    # ─────────────────────────────────────────
    - name: Wait for port 80 to be reachable
      wait_for:
        host: "{{ inventory_hostname }}"
        port: 80
        delay: 5
        timeout: 60

    - name: Check app HTTP response
      uri:
        url: "http://{{ inventory_hostname }}/"
        return_content: yes
        status_code: 200
      register: app_response
      retries: 5
      delay: 10
      until: app_response.status == 200