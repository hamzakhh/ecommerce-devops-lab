---
- name: Deploy E-Commerce Application
  hosts: web
  become: yes
  gather_facts: no          # ← RESTER À no jusqu'à avoir Python + swap

  vars:
    ansible_python_interpreter: /usr/bin/python3
    app_dir: /opt/ecommerce
    compose_file: "{{ app_dir }}/docker-compose.yml"

  tasks:

    # ═══════════════════════════════════════════════════
    # PHASE 1 : RAW uniquement (aucun Python requis)
    # ═══════════════════════════════════════════════════
    
    - name: "[1/10] Installer Python3 si manquant"
      raw: |
        if ! command -v python3 &> /dev/null; then
          dnf install -y python3 python3-pip
        fi
        python3 --version
      args:
        executable: /bin/bash

    - name: "[2/10] Créer le swap (4 Go)"
      raw: |
        if ! swapon --show | grep -q /swapfile; then
          dd if=/dev/zero of=/swapfile bs=256M count=16
          chmod 600 /swapfile
          mkswap /swapfile
          swapon /swapfile
          grep -q /swapfile /etc/fstab || echo '/swapfile swap swap defaults 0 0' >> /etc/fstab
        fi
        echo "=== MEMOIRE ==="
        free -h
        echo "==============="
      args:
        executable: /bin/bash

    # ═══════════════════════════════════════════════════
    # PHASE 2 : Maintenant on peut utiliser Python
    # ═══════════════════════════════════════════════════
    
    - name: "[3/10] Gather facts"
      setup:

    - name: "[4/10] Installer packages système"
      dnf:                      # ← dnf, pas yum (Amazon Linux 2023)
        name:
          - curl
          - gnupg2
          - python3-pip
        state: present

    - name: "[5/10] Installer Docker"
      shell: |
        dnf install -y docker
      args:
        creates: /usr/bin/docker

    - name: "[6/10] Installer Docker Compose"
      shell: |
        curl -SL "https://github.com/docker/compose/releases/latest/download/docker-compose-linux-x86_64" \
          -o /usr/local/bin/docker-compose
        chmod +x /usr/local/bin/docker-compose
      args:
        creates: /usr/local/bin/docker-compose

    - name: "[7/10] Installer SDK Python Docker"
      pip:
        name: docker
        state: present

    - name: "[8/10] Démarrer Docker"
      systemd:
        name: docker
        state: started
        enabled: yes

    - name: "[8b/10] Ajouter ec2-user au groupe docker"
      user:
        name: ec2-user
        groups: docker
        append: yes

    # ═══════════════════════════════════════════════════
    # PHASE 3 : Déployer l'application
    # ═══════════════════════════════════════════════════
    
    - name: "[9/10] Copier les fichiers de config"
      copy:
        src: "{{ item.src }}"
        dest: "{{ item.dest }}"
        owner: ec2-user
        group: ec2-user
        mode: '0644'
      loop:
        - { src: docker-compose.yml, dest: "{{ compose_file }}" }
        - { src: nginx.conf, dest: "{{ app_dir }}/nginx.conf" }

    - name: "[9b/10] Créer le répertoire application"
      file:
        path: "{{ app_dir }}"
        state: directory
        owner: ec2-user
        group: ec2-user
        mode: '0755'

    - name: "[10/10] Démarrer les conteneurs"
      shell: |
        docker-compose -f {{ compose_file }} pull
        docker-compose -f {{ compose_file }} up -d
      become_user: ec2-user

    # ═══════════════════════════════════════════════════
    # PHASE 4 : Vérifications
    # ═══════════════════════════════════════════════════
    
    - name: "Vérifier port 80"
      wait_for:
        host: "{{ inventory_hostname }}"
        port: 80
        delay: 5
        timeout: 60

    - name: "Vérifier réponse HTTP"
      uri:
        url: "http://{{ inventory_hostname }}/"
        return_content: yes
        status_code: 200
      register: app_response
      retries: 5
      delay: 10
      until: app_response.status == 200