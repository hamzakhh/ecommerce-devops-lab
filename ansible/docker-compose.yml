version: "3.8"

services:

  # ─────────────────────────────────────────
  # MongoDB — base de données
  # ─────────────────────────────────────────
  mongodb:
    image: mongo:6.0
    container_name: mongodb
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: secret123
      MONGO_INITDB_DATABASE: ecommerce
    volumes:
      - mongo_data:/data/db
    networks:
      - app_network
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─────────────────────────────────────────
  # Node.js — backend API
  # ─────────────────────────────────────────
  app:
    image: node:18-alpine
    container_name: nodejs_app
    restart: unless-stopped
    working_dir: /app
    environment:
      NODE_ENV: production
      PORT: 3000
      MONGO_URI: mongodb://admin:secret123@mongodb:27017/ecommerce?authSource=admin
    volumes:
      - ./app:/app
    command: >
      sh -c "npm install &&
             npm install -g pm2 &&
             pm2 start index.js --name ecommerce-app --no-daemon"
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - app_network
    expose:
      - "3000"

  # ─────────────────────────────────────────
  # Nginx — reverse proxy
  # ─────────────────────────────────────────
  nginx:
    image: nginx:alpine
    container_name: nginx_proxy
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
    networks:
      - app_network

volumes:
  mongo_data:

networks:
  app_network:
    driver: bridge