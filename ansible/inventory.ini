[web]
# Ces IPs sont générées dynamiquement par GitHub Actions (étape Terraform)
# Exemple statique pour tests locaux :
# 1.2.3.4 ansible_user=ec2-user ansible_ssh_private_key_file=~/.ssh/key.pem

[web:vars]
ansible_ssh_common_args='-o StrictHostKeyChecking=no'
ansible_python_interpreter=/usr/bin/python3